# ⚠️ WORKFLOW NÀY ĐANG TẮT — xem docs/VE-CI.md
#
# Lý do: tài khoản GitHub của chủ repo bị khoá Actions do một giao dịch thanh
# toán bị ngân hàng từ chối. Không liên quan tới code của nhóm. File này giữ
# nguyên để bật lại khi gỡ được, chỉ cần chạy:
#
#     gh workflow enable ci.yml
#
# Trong lúc chờ, cả nhóm chạy test ở máy trước khi tạo Pull Request:
#
#     python -m pytest

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Chạy kiểm thử
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -v
