<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#37474f" stroke-width="1.6"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 5 L 7 1 L 14 5 L 7 9 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="1040" height="800" fill="#ffffff"/>

  <text x="520" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1c2833">Sơ đồ lớp — Snake Game</text>
  <text x="520" y="50" text-anchor="middle" font-size="12" fill="#607d8b">Nhóm 3 — Trường Đại học Công nghệ Thông tin, ĐHQG TP.HCM</text>

  <!-- ================= GameState ================= -->
  <rect x="40" y="90" width="240" height="130" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <line x1="40" y1="140" x2="280" y2="140" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="160" y="110" text-anchor="middle" font-size="11" font-style="italic" fill="#6a1b9a">«enumeration»</text>
  <text x="160" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#4a148c">GameState</text>
  <text x="56" y="160" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">MENU</text>
  <text x="56" y="177" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">PLAYING</text>
  <text x="56" y="194" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">PAUSED</text>
  <text x="56" y="211" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">GAME_OVER</text>

  <!-- ================= Snake ================= -->
  <rect x="40" y="270" width="240" height="200" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <line x1="40" y1="330" x2="280" y2="330" stroke="#2e7d32" stroke-width="1.5"/>
  <line x1="40" y1="378" x2="280" y2="378" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="160" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">Snake</text>
  <text x="160" y="309" text-anchor="middle" font-size="10.5" fill="#607d8b">snake.py</text>
  <text x="160" y="324" text-anchor="middle" font-size="10.5" font-style="italic" fill="#607d8b">Lê Kiều Diễm</text>
  <text x="56" y="349" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">body : list[(int, int)]</text>
  <text x="56" y="367" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">direction : (int, int)</text>
  <text x="56" y="398" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">head  «property»</text>
  <text x="56" y="416" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">change_direction(d)</text>
  <text x="56" y="434" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">move(grow=False)</text>
  <text x="56" y="452" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">hits_self() : bool</text>

  <!-- ================= Food ================= -->
  <rect x="40" y="520" width="240" height="120" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <line x1="40" y1="578" x2="280" y2="578" stroke="#c62828" stroke-width="1.5"/>
  <line x1="40" y1="606" x2="280" y2="606" stroke="#c62828" stroke-width="1.5"/>
  <text x="160" y="542" text-anchor="middle" font-size="15" font-weight="600" fill="#b71c1c">Food</text>
  <text x="160" y="559" text-anchor="middle" font-size="10.5" fill="#607d8b">food.py</text>
  <text x="160" y="573" text-anchor="middle" font-size="10.5" font-style="italic" fill="#607d8b">Lê Kiều Diễm</text>
  <text x="56" y="597" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">position : (int, int)</text>
  <text x="56" y="626" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">respawn(occupied)</text>

  <!-- ================= Game ================= -->
  <rect x="350" y="90" width="330" height="530" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <line x1="350" y1="150" x2="680" y2="150" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="350" y1="404" x2="680" y2="404" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="350" y1="558" x2="680" y2="558" stroke="#1976d2" stroke-width="1.5"/>
  <text x="515" y="113" text-anchor="middle" font-size="17" font-weight="600" fill="#0d47a1">Game</text>
  <text x="515" y="130" text-anchor="middle" font-size="10.5" fill="#607d8b">game.py</text>
  <text x="515" y="144" text-anchor="middle" font-size="10.5" font-style="italic" fill="#607d8b">Hồ Văn Trọng</text>

  <text x="366" y="170" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">screen : Surface</text>
  <text x="366" y="188" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">clock : Clock</text>
  <text x="366" y="206" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">running : bool</text>
  <text x="366" y="224" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">state : GameState</text>
  <text x="366" y="242" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">score : int</text>
  <text x="366" y="260" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">highscore : int</text>
  <text x="366" y="278" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">new_record : bool</text>
  <text x="366" y="296" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">speed : int</text>
  <text x="366" y="314" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">difficulty_name : str</text>
  <text x="366" y="332" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">move_timer : float</text>
  <text x="366" y="350" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">direction_queue : deque</text>
  <text x="366" y="368" font-size="11.5" font-family="Consolas, monospace" fill="#90a4ae">snake : Snake</text>
  <text x="366" y="386" font-size="11.5" font-family="Consolas, monospace" fill="#90a4ae">food : Food</text>
  <text x="560" y="368" font-size="10" font-style="italic" fill="#ef6c00">chờ T4</text>
  <text x="560" y="386" font-size="10" font-style="italic" fill="#ef6c00">chờ T4</text>

  <text x="366" y="424" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">reset_round()</text>
  <text x="366" y="442" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">end_round()</text>
  <text x="366" y="460" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">handle_events()</text>
  <text x="366" y="478" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">handle_keydown(key)</text>
  <text x="366" y="496" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">update(dt)</text>
  <text x="366" y="514" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">step()</text>
  <text x="366" y="532" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">draw()</text>
  <text x="366" y="550" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">run()</text>

  <text x="366" y="578" font-size="10.5" font-style="italic" fill="#607d8b">hàm mức module trong game.py</text>
  <text x="366" y="597" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">load_highscore(path) : int</text>
  <text x="366" y="613" font-size="11.5" font-family="Consolas, monospace" fill="#37474f">save_highscore(score, path)</text>

  <!-- ================= ui ================= -->
  <rect x="750" y="90" width="250" height="290" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <line x1="750" y1="150" x2="1000" y2="150" stroke="#f9a825" stroke-width="1.5"/>
  <text x="875" y="110" text-anchor="middle" font-size="11" font-style="italic" fill="#e65100">«module»</text>
  <text x="875" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#e65100">ui</text>
  <text x="875" y="144" text-anchor="middle" font-size="10.5" font-style="italic" fill="#607d8b">ui.py — Đặng Đức Tín</text>
  <text x="764" y="172" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_grid(surface)</text>
  <text x="764" y="196" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_text(surface, text,</text>
  <text x="764" y="212" font-size="11" font-family="Consolas, monospace" fill="#37474f">          size, center, color)</text>
  <text x="764" y="236" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_snake(surface, body)</text>
  <text x="764" y="260" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_food(surface, position)</text>
  <text x="764" y="284" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_score(surface, score,</text>
  <text x="764" y="300" font-size="11" font-family="Consolas, monospace" fill="#37474f">           highscore)</text>
  <text x="764" y="324" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_menu(surface)</text>
  <text x="764" y="348" font-size="11" font-family="Consolas, monospace" fill="#37474f">draw_game_over(surface,</text>
  <text x="764" y="364" font-size="11" font-family="Consolas, monospace" fill="#37474f">               score)</text>

  <!-- ================= config ================= -->
  <rect x="750" y="420" width="250" height="280" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <line x1="750" y1="480" x2="1000" y2="480" stroke="#546e7a" stroke-width="1.5"/>
  <text x="875" y="440" text-anchor="middle" font-size="11" font-style="italic" fill="#37474f">«module»</text>
  <text x="875" y="458" text-anchor="middle" font-size="15" font-weight="600" fill="#263238">config</text>
  <text x="875" y="474" text-anchor="middle" font-size="10.5" font-style="italic" fill="#607d8b">config.py — Đặng Đức Tín</text>
  <text x="764" y="502" font-size="11" font-family="Consolas, monospace" fill="#37474f">CELL_SIZE</text>
  <text x="764" y="522" font-size="11" font-family="Consolas, monospace" fill="#37474f">GRID_WIDTH, GRID_HEIGHT</text>
  <text x="764" y="542" font-size="11" font-family="Consolas, monospace" fill="#37474f">WINDOW_WIDTH, WINDOW_HEIGHT</text>
  <text x="764" y="562" font-size="11" font-family="Consolas, monospace" fill="#37474f">WINDOW_TITLE</text>
  <text x="764" y="582" font-size="11" font-family="Consolas, monospace" fill="#37474f">FPS</text>
  <text x="764" y="602" font-size="11" font-family="Consolas, monospace" fill="#37474f">SPEED_EASY / NORMAL / HARD</text>
  <text x="764" y="622" font-size="11" font-family="Consolas, monospace" fill="#37474f">COLOR_BACKGROUND, COLOR_GRID</text>
  <text x="764" y="642" font-size="11" font-family="Consolas, monospace" fill="#37474f">COLOR_SNAKE_*, COLOR_FOOD</text>
  <text x="764" y="662" font-size="11" font-family="Consolas, monospace" fill="#37474f">SCORE_PER_FOOD</text>
  <text x="764" y="682" font-size="11" font-family="Consolas, monospace" fill="#37474f">HIGHSCORE_FILE</text>

  <!-- ================= quan he ================= -->
  <line x1="280" y1="155" x2="344" y2="155" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="312" y="147" text-anchor="middle" font-size="10" font-style="italic" fill="#607d8b">dùng</text>

  <line x1="344" y1="370" x2="286" y2="370" stroke="#37474f" stroke-width="1.8" marker-start="url(#diamond)" marker-end="url(#open)"/>
  <text x="316" y="362" text-anchor="middle" font-size="10.5" fill="#37474f">1</text>

  <line x1="344" y1="580" x2="286" y2="580" stroke="#37474f" stroke-width="1.8" marker-start="url(#diamond)" marker-end="url(#open)"/>
  <text x="316" y="572" text-anchor="middle" font-size="10.5" fill="#37474f">1</text>

  <line x1="680" y1="200" x2="744" y2="200" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="712" y="192" text-anchor="middle" font-size="10" font-style="italic" fill="#607d8b">gọi</text>

  <line x1="680" y1="520" x2="744" y2="520" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="712" y="512" text-anchor="middle" font-size="10" font-style="italic" fill="#607d8b">đọc</text>

  <line x1="875" y1="380" x2="875" y2="414" stroke="#37474f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- ================= chu thich ================= -->
  <rect x="40" y="680" width="640" height="86" rx="6" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="56" y="702" font-size="11.5" font-weight="600" fill="#37474f">Chú thích</text>
  <text x="56" y="722" font-size="11" fill="#546e7a">◆——▸  quan hệ hợp thành: một Game sở hữu đúng một Snake và một Food</text>
  <text x="56" y="740" font-size="11" fill="#546e7a">- - -▸  quan hệ phụ thuộc: gọi hàm hoặc đọc hằng số, không sở hữu</text>
  <text x="56" y="758" font-size="11" fill="#546e7a">Food cũng đọc GRID_WIDTH và GRID_HEIGHT từ config khi sinh mồi ngẫu nhiên.</text>
</svg>
